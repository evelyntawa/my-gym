<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3ee"><title>My Gym</title>
<style>
body{margin:0;background:#f7f3ee;font-family:Arial;color:#292622}.app{max-width:520px;margin:auto;padding:20px 16px 70px}h1{margin:8px 0}.sub{color:#777;margin:5px 0 18px}.card{background:white;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 3px 14px #0001}.day{display:flex;justify-content:space-between}.tag{background:#eee6dc;border-radius:20px;padding:6px 10px;font-size:12px}button{border:0;border-radius:13px;padding:11px 15px;font-weight:bold}.start{width:100%;background:#292622;color:white;margin-top:12px}.back{background:#eee6dc}.exercise{border-top:1px solid #eee;padding:14px 0}.exercise:first-child{border:0}.title{font-weight:bold;font-size:17px}.sets{font-weight:bold;margin:4px 0}.how{font-size:14px;color:#666;line-height:1.4}.row{display:flex;align-items:center;gap:7px;margin-top:8px}.weight{width:80px;padding:9px;border:1px solid #ddd;border-radius:9px}.check{margin-left:auto;width:42px;height:42px;border-radius:50%;background:#eee}.done{background:#292622;color:white}.progress{height:8px;background:#eee;border-radius:8px}.bar{height:100%;background:#292622;border-radius:8px;width:0}.timer{text-align:center;font-size:40px;font-weight:bold;margin:12px}.hidden{display:none}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Gym">
<link rel="apple-touch-icon" href="icon-180.png">

</head><body><div class="app">
<section id="home"><h1>My Gym 🏋️‍♀️</h1><div class="sub">Your Monday–Friday workout plan</div><div id="week"></div></section>
<section id="workout" class="hidden"><button class="back" onclick="home()">← Back</button><h1 id="day"></h1><div class="sub" id="focus"></div><div class="progress"><div id="bar" class="bar"></div></div><p id="prog"></p><div class="card" id="list"></div><div class="card"><b>REST TIMER</b><div id="timer" class="timer">00:30</div><button onclick="timer(30)">30 sec</button> <button onclick="timer(60)">60 sec</button></div></section></div>
<script>
const W={
MONDAY:["ABS + ARMS",[["Warm-up walk","5 min","Walk easily to warm up."],["Bicep Curl","10 × 3","Keep elbows by your sides; curl up and lower slowly."],["Hammer Curl","10 × 3","Palms face each other; curl with control."],["Shoulder Press","10 × 3","Start at shoulders; press overhead and lower slowly."],["Lateral Raise","10 × 2","Use light weights; raise arms to shoulder height."],["Tricep Pushdown","10 × 3","Keep elbows tucked; push the rope down."],["Dead Bug","8 each side × 3","Move opposite arm and leg slowly while bracing your core."],["Plank","20–30 sec × 3","Keep your body straight and brace your core."],["Cable Crunch","10 × 3","Curl your upper body down gently and return with control."]]],
TUESDAY:["LEGS + POWER",[["Warm-up walk","5 min","Walk easily to warm up."],["Box Jump","5 × 3","Jump onto a sturdy box, land softly, then step down."],["Goblet Squat","10 × 3","Hold one dumbbell at your chest; squat and stand."],["Leg Press","10 × 3","Push the platform away smoothly, then return slowly."],["Walking Lunge","8 each leg × 3","Step forward, lower, then push through your front foot."],["Glute Bridge","12 × 3","Lift hips, squeeze glutes, then lower."],["Hamstring Curl","10 × 3","Curl the pad toward you smoothly, then return."],["Calf Raise","12 × 3","Rise onto toes, pause, then lower."]]],
WEDNESDAY:["BACK + SHOULDERS",[["Warm-up walk","5 min","Walk easily to warm up."],["Lat Pulldown","8–10 × 3","Pull the bar toward your upper chest, then release slowly."],["Seated Cable Row","10 × 3","Sit tall; pull handles toward you and release slowly."],["Shoulder Press","8–10 × 3","Press dumbbells overhead and lower with control."],["Face Pull","10 × 3","Pull the rope toward your face with elbows high."],["Reverse Fly","10 × 2","Use light weights; open arms out with control."],["Straight-Arm Pulldown","10 × 2","Keep arms mostly straight and pull toward thighs."],["Lateral Raise","10 × 2","Raise light dumbbells to shoulder height."]]],
THURSDAY:["FULL BODY — LIGHT",[["Warm-up walk","5 min","Walk easily to warm up."],["Goblet Squat","8–10 × 2","Hold dumbbell at chest; squat and stand."],["Leg Press","10 × 2","Push platform away smoothly and return."],["Cable Row","10 × 2","Sit tall and pull handles toward your body."],["Bicep Curl","10 × 2","Keep elbows close and curl with control."],["Glute Bridge","12 × 2","Lift hips, squeeze glutes, then lower."],["Shoulder Press","8–10 × 2","Press dumbbells overhead and lower slowly."],["Dead Bug","8 each side × 2","Move opposite arm and leg slowly."],["Plank","20 sec × 2","Hold a straight body position and brace your core."]]],
FRIDAY:["POWER + CORE",[["Warm-up walk","5 min","Walk easily to warm up."],["Box Jump","5 × 3","Jump onto a sturdy box, land softly, then step down."],["Step-Up","8 each leg × 3","Step onto a sturdy platform, stand tall, then step down."],["Goblet Squat","10 × 3","Hold dumbbell at chest; squat and stand."],["Glute Bridge","12 × 3","Lift hips, squeeze glutes, then lower."],["Plank","20–30 sec × 3","Keep your body straight and brace your core."],["Dead Bug","8 each side × 3","Slowly extend opposite arm and leg."],["Bird Dog","8 each side × 2","From hands and knees, extend opposite arm and leg."],["Pallof Press","10 each side × 2","Press cable handle straight out while resisting rotation."]]]
};
let day="",S=JSON.parse(localStorage.gym||"{}"),iv;
function save(){localStorage.gym=JSON.stringify(S)}
function home(){document.getElementById("home").classList.remove("hidden");document.getElementById("workout").classList.add("hidden");render()}
function render(){let x=document.getElementById("week");x.innerHTML="";for(let d in W){let n=W[d][1].filter((_,i)=>S[d+i]?.done).length,c=document.createElement("div");c.className="card";c.innerHTML="<div class=day><h2>"+d+"</h2><span class=tag>"+n+"/"+W[d][1].length+"</span></div><div class=sub>"+W[d][0]+"</div><button class=start>Start workout →</button>";c.querySelector("button").onclick=()=>open(d);x.appendChild(c)}}
function open(d){day=d;document.getElementById("home").classList.add("hidden");document.getElementById("workout").classList.remove("hidden");document.getElementById("day").textContent=d;document.getElementById("focus").textContent=W[d][0];draw()}
function draw(){let x=document.getElementById("list"),a=W[day][1],done=0;x.innerHTML="";a.forEach((e,i)=>{let s=S[day+i]||{},c=document.createElement("div");c.className="exercise";c.innerHTML="<div class=title>"+e[0]+"</div><div class=sets>"+e[1]+"</div><div class=how>"+e[2]+"</div><div class=row><input class=weight placeholder='Weight' value='"+(s.weight||"")+"'><span>kg</span><button class='check "+(s.done?"done":"")+"'>"+(s.done?"✓":"○")+"</button></div>";c.querySelector("input").oninput=z=>{S[day+i]={...(S[day+i]||{}),weight:z.target.value};save()};c.querySelector(".check").onclick=()=>{S[day+i]={...(S[day+i]||{}),done:!s.done};save();draw()};x.appendChild(c);if(s.done)done++});document.getElementById("bar").style.width=done/a.length*100+"%";document.getElementById("prog").textContent=done+" of "+a.length+" completed"}
let left=30;function timer(n){clearInterval(iv);left=n;tick();iv=setInterval(()=>{left--;tick();if(left<=0)clearInterval(iv)},1000)}function tick(){document.getElementById("timer").textContent="00:"+String(Math.max(0,left)).padStart(2,"0")}render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>

</body></html>
